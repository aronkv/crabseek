[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["DarkAaronfox"]
repository = "https://github.com/DarkAaronfox/crabseek"
homepage = "https://github.com/DarkAaronfox/crabseek"

# `cargo run` stays debuggable but no longer crawls through zlib and
# protocol decoding: our code gets basic optimizations, dependencies full.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
