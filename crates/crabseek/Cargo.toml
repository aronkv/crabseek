[package]
name = "crabseek"
description = "A fast Soulseek client for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["soulseek", "p2p", "tui", "music", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
directories = "6.0.0"
futures = "0.3.34"
# Talks D-Bus on our Tokio runtime instead of bringing its own.
notify-rust = { version = "4.17.0", default-features = false, features = ["z-with-tokio"] }
# Without the calendar widget and the macros, which pull in more crates.
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
    "unstable-rendered-line-info",
] }
crabseek-net = { version = "0.2.1", path = "../net" }
crabseek-proto = { version = "0.2.1", path = "../proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
libc = "0.2.189"
